name: Build and publish images and binaries

on:
  push:
    branches: [main]

# Only the newest push to a ref should produce :latest; cancel superseded runs.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: Dockerfile.server
            image: ghcr.io/davefinster/configfs-server
          - name: client
            dockerfile: Dockerfile.client
            image: ghcr.io/davefinster/configfs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:latest

  release-binaries:
    name: release-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build standalone fs binaries (linux/amd64 + linux/arm64)
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            echo "Building linux/$arch"
            # The fs client has no cgo deps (only the server uses sqlite), so a
            # static CGO-free cross-compile keeps the binaries portable.
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o fs ./cmd/fs
            tar -czf "dist/fs-linux-$arch.tar.gz" fs
            rm -f fs
          done
          ls -l dist

      - name: Publish binaries to the rolling "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Recreate the rolling "latest" prerelease so its tag, target commit
          # and assets always reflect the newest push to main.
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest \
            --prerelease \
            --title "latest (main)" \
            --notes "Standalone fs/client binaries built from ${{ github.sha }}." \
            dist/*.tar.gz
